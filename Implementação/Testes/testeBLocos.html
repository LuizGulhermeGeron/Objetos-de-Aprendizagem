<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Listas Arrastáveis com Validação</title>

  <link rel="stylesheet" href="testeBlocosStyle.css">
</head>

<body>
  <h2>Listas Arrastáveis</h2>

  <div class="testeBlocosListas">
    <div class="testeBlocosLista lista" id="listaA">
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="1" data-listaDestino="listaA">Item A1</div>
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="2" data-listaDestino="listaA">Item A2</div>
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="3" data-listaDestino="listaA">Item A3</div>
    </div>

    <div class="testeBlocosLista lista" id="listaB">
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="1" data-listaDestino="listaB">Item B1</div>
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="2" data-listaDestino="listaB">Item B2</div>
      <div class="testeBlocosItem item" draggable="true" data-ordemDestino="3" data-listaDestino="listaB">Item B3</div>
    </div>
  </div>

  <button onclick="validarListas()">Validar</button>
  <button onclick="resetarListas()">Reset</button>

  <script src="testeBlocosScript.js"></script>
</body>
</html>
